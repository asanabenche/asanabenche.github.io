<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Room</title>

    <!-- DNS Prefetch for faster cold starts -->
    <link rel="dns-prefetch" href="//asanabenche.github.io">

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Preload Critical Images -->
    <link rel="preload" as="image" href="images/Listen/listenBG.png" fetchpriority="high">
    <link rel="preload" as="image" href="images/Listen/recordPlayer.png">
</head>

<body class="loading">
    <div class="page-transition">
        <div class="loading-eggs">
            <img src="images/eggLoad.GIF" alt="" class="loading-egg-gif">

        </div>
    </div>
    <div class="bg-wrapper listening-wrapper">
        <img src="images/Listen/listenBG.png" alt="Background" class="background-img listening-bg" fetchpriority="high">

        <!-- Exit Sign -->
        <a href="index.html" class="overlay-link exit-btn exit-listening">
            <img src="images/exitSign.png" alt="Exit" class="overlay-img">
        </a>

        <!-- Global Audio Indicator (shows when music is playing) -->
        <div class="global-audio-indicator" id="globalAudioIndicator">
            <img src="images/Home/soundOn.gif" alt="Audio Playing" class="overlay-img">
        </div>

        <!-- Skip Button -->
        <a href="#" class="overlay-link skip-btn">
            <img src="images/Listen/skipSign.png" alt="Skip" class="overlay-img">
        </a>

        <!-- Start/Stop Button -->
        <div class="overlay-link start-stop-btn" id="playPauseBtn">
            <img src="images/Listen/recordPlayer.png" alt="Start/Stop" class="overlay-img">
        </div>

        <!-- Duck Grapes -->
        <div class="overlay-simple duck-grapes-img">
            <img src="images/Listen/duckGrapes.png" alt="Duck Grapes" class="overlay-img">
        </div>

        <!-- Project Switch Container -->
        <div class="overlay-simple project-switch-container">
            <div class="bird-music-link" id="projectLink">
                <img src="images/Listen/SF.jpg" alt="Project Cover" class="overlay-img" id="projectImage">
            </div>
            <img src="images/Listen/swapButton.PNG" alt="Swap Project" id="imageSwapButton" class="image-swap-button">
        </div>

        <!-- Streaming Modal -->
        <div class="streaming-modal-overlay" id="streamingModal">
            <div class="streaming-modal">
                <div class="streaming-modal-content">
                    <div class="streaming-modal-cover-wrap">
                        <img src="" alt="Project Cover" class="streaming-modal-cover" id="streamingModalImage">
                        <span class="streaming-modal-close" id="streamingModalClose">✕</span>
                    </div>
                    <div class="streaming-modal-tracklist" id="streamingModalTracklist"></div>
                </div>
                <div class="streaming-modal-buttons">
                    <a href="#" class="streaming-btn" id="streamBtnSpotify" target="_blank" rel="noopener noreferrer">
                        <img src="images/Listen/projectSpot.png" alt="Spotify" class="streaming-btn-img">
                    </a>
                    <a href="#" class="streaming-btn" id="streamBtnApple" target="_blank" rel="noopener noreferrer">
                        <img src="images/Listen/projectApp.png" alt="Apple Music" class="streaming-btn-img">
                    </a>
                    <a href="#" class="streaming-btn" id="streamBtnTidal" target="_blank" rel="noopener noreferrer">
                        <img src="images/Listen/projectTidal.png" alt="Tidal" class="streaming-btn-img">
                    </a>
                </div>
            </div>
        </div>

        <!-- Wall Art -->
        <div class="wall-art">
            <img src="images/Listen/wallArt.png" alt="Wall Art" class="overlay-img">
        </div>

        <!-- Music Animations (Hidden by default via CSS scale) -->
        <div class="music-anim purple-sound">
            <img src="images/Listen/purpleSound.gif" alt="Music Anim" class="overlay-img" loading="lazy"
                decoding="async">
        </div>
        <div class="music-anim yellow-sound">
            <img src="images/Listen/yellowSound.gif" alt="Music Anim" class="overlay-img" loading="lazy"
                decoding="async">
        </div>
        <div class="music-anim red-sound">
            <img src="images/Listen/redSound.gif" alt="Music Anim" class="overlay-img" loading="lazy" decoding="async">
        </div>

        <!-- Dynamic Popup Image Container -->
        <div class="dynamic-popup">
            <img src="" alt="Popup" class="popup-img" id="popupImage">
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
