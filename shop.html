<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <!-- DNS Prefetch for faster cold starts -->
    <link rel="dns-prefetch" href="//asanabenche.github.io">

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Preload Critical Images -->
    <link rel="preload" as="image" href="images/Shop/shopBG.png" fetchpriority="high">
    <link rel="preload" as="image" href="images/Shop/shopItem1.png">
    <link rel="preload" as="image" href="images/Shop/shopItem2.png">
    <link rel="preload" as="image" href="images/Shop/shopItem3.png">
    <link rel="preload" as="image" href="images/Shop/shopKeep.png">
</head>

<body class="loading">
    <div class="page-transition">
        <div class="loading-eggs">
            <img src="images/eggLoad.GIF" alt="" class="loading-egg-gif">

        </div>
    </div>
    <div class="bg-wrapper shop-wrapper">
        <img src="images/Shop/shopBG.png" alt="Shop Background" class="background-img shop-bg" fetchpriority="high">

        <!-- Exit Sign -->
        <a href="index.html" class="overlay-link exit-btn exit-shop">
            <img src="images/exitSign.png" alt="Exit" class="overlay-img">
        </a>

        <!-- Global Audio Indicator (shows when music is playing) -->
        <div class="global-audio-indicator" id="globalAudioIndicator">
            <img src="images/Home/soundOn.gif" alt="Audio Playing" class="overlay-img">
        </div>

        <!-- Door Link (External) -->
        <a href="https://asanabencheband.wixsite.com/asanabenche" target="_blank" class="overlay-link door-btn">
            <img src="images/Shop/door.png" alt="Door" class="overlay-img">
        </a>

        <!-- Stuff Link (External) -->
        <a href="https://asanabencheband.wixsite.com/asanabenche/accessories" target="_blank"
            class="overlay-link stuff-btn">
            <img src="images/Shop/stuffBowl.png" alt="Stuff Bowl" class="overlay-img">
        </a>

        <!-- (Item 1) -->
        <a href="https://asanabencheband.wixsite.com/asanabenche/product-page/suit-friday-t-shirt-sky-blue"
            target="_blank" class="overlay-link shop-item1-btn">
            <img src="images/Shop/shopItem1.png" alt="Shop Item 1" class="overlay-img">
        </a>

        <!-- (Item 2)-->
        <a href="https://asanabencheband.wixsite.com/asanabenche/product-page/suit-friday-t-shirt-coffee"
            target="_blank" class="overlay-link shop-item2-btn">
            <img src="images/Shop/shopItem2.png" alt="Shop Item 2" class="overlay-img">
        </a>

        <!-- (Item 3) -->
        <a href="https://asanabencheband.wixsite.com/asanabenche/product-page/four-friends-tote" target="_blank"
            class="overlay-link shop-item3-btn">
            <img src="images/Shop/shopItem3.png" alt="Shop Item 3" class="overlay-img">
        </a>

        <!-- Shop Keep -->
        <div class="shop-keep">
            <img src="images/Shop/shopKeep.png" alt="Shop Keep" class="overlay-img">
        </div>

        <!-- Flowers -->
        <div class="flower-cluster"></div>
        <div class="shop-flower flower-1" data-audio="audioFiles/shopAudio/Flower01.wav">
            <img src="images/Shop/Flower1.png" alt="Flower 1" class="overlay-img flower-1-static">
            <img src="images/Shop/Flower1_Anim.gif" alt="Flower 1 Animation" class="overlay-img flower-1-anim"
                style="display: none;" loading="lazy" decoding="async">
        </div>
        <div class="shop-flower flower-2" data-audio="audioFiles/shopAudio/Flower02.wav">
            <img src="images/Shop/Flower2.png" alt="Flower 2" class="overlay-img flower-2-static">
            <img src="images/Shop/Flower2_Anim.gif" alt="Flower 2 Animation" class="overlay-img flower-2-anim"
                style="display: none;" loading="lazy" decoding="async">
        </div>
        <div class="shop-flower flower-3" data-audio="audioFiles/shopAudio/Flower03.wav">
            <img src="images/Shop/Flower3.png" alt="Flower 3" class="overlay-img flower-3-static">
            <img src="images/Shop/Flower3_Anim.gif" alt="Flower 3 Animation" class="overlay-img flower-3-anim"
                style="display: none;" loading="lazy" decoding="async">
        </div>
        <div class="shop-flower flower-4" data-audio="audioFiles/shopAudio/Flower04.wav">
            <img src="images/Shop/Flower4.png" alt="Flower 4" class="overlay-img flower-4-static">
            <img src="images/Shop/Flower4_Anim.gif" alt="Flower 4 Animation" class="overlay-img flower-4-anim"
                style="display: none;" loading="lazy" decoding="async">
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
